    <text x="8" y="18" fill="#EC4899" font-family="monospace" font-size="10" opacity="0.9">&lt;/&gt;</text>
    <line x1="8" y1="28" x2="42" y2="28" stroke="#EC4899" stroke-width="1.5" opacity="0.5"/>
