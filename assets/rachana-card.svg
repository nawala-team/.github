<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
    <filter id="glow5"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow5"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg5)" rx="16" filter="url(#shadow5)"/>
  <rect width="398" height="198" x="1" y="1" fill="none" stroke="url(#pink)" stroke-width="1.5" rx="15" opacity="0.8"/>
  <circle cx="50" cy="40" r="80" fill="#EC4899" opacity="0.03"/>
  <circle cx="380" cy="180" r="60" fill="#DB2777" opacity="0.05"/>
