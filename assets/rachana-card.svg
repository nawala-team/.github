<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#1f2a37"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow5">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="400" height="200" fill="url(#bg5)" rx="16" filter="url(#shadow5)"/>
  <rect width="398" height="198" x="1" y="1" fill="none" stroke="url(#purple)" stroke-width="2" rx="15">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <circle cx="55" cy="50" r="2" fill="#8b5cf6" opacity="0.6">
    <animate attributeName="cy" values="50;150;50" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="150" r="1.5" fill="#8b5cf6" opacity="0.4">
    <animate attributeName="cy" values="150;50;150" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="100" r="40" fill="url(#purple)" opacity="0.2"/>
  <g transform="translate(45,75)">
    <rect width="50" height="50" rx="10" fill="url(#purple)"/>
    <text x="25" y="35" text-anchor="middle" fill="#fff" font-family="monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>
  </g>
  
  <text x="230" y="60" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="bold" filter="url(#glow5)">Rachana Code</text>
  
  <rect x="170" y="72" width="120" height="24" rx="12" fill="#8b5cf6" opacity="0.3"/>
  <text x="230" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Code Editor</text>
  
  <text x="230" y="120" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">Modern Development Environment</text>
  <text x="230" y="140" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="11">Fast • Extensible • Beautiful</text>
  
  <rect x="140" y="155" width="70" height="20" rx="10" fill="#3178C6" opacity="0.4"/>
  <text x="175" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">TypeScript</text>
  <rect x="220" y="155" width="80" height="20" rx="10" fill="#4a5568" opacity="0.4"/>
  <text x="260" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Coming Soon</text>
</svg>
