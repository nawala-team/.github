<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2a1a0d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F46800"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="400" height="200" fill="url(#bg4)" rx="16" filter="url(#shadow4)"/>
  <rect width="398" height="198" x="1" y="1" fill="none" stroke="url(#orange)" stroke-width="2" rx="15">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <circle cx="55" cy="50" r="2" fill="#F46800" opacity="0.6">
    <animate attributeName="cy" values="50;150;50" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="150" r="1.5" fill="#FFB800" opacity="0.4">
    <animate attributeName="cy" values="150;50;150" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="100" r="40" fill="url(#orange)" opacity="0.2"/>
  <text x="70" y="115" text-anchor="middle" font-size="45" filter="url(#glow4)">📊</text>
  
  <text x="230" y="60" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="bold" filter="url(#glow4)">Prahara</text>
  
  <rect x="155" y="72" width="150" height="24" rx="12" fill="#F46800" opacity="0.3"/>
  <text x="230" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Observability Platform</text>
  
  <text x="230" y="120" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">Monitoring, Logging &amp; Tracing</text>
  <text x="230" y="140" text-anchor="middle" fill="#fdba74" font-family="Arial, sans-serif" font-size="11">Metrics • Alerts • Dashboards • APM</text>
  
  <rect x="115" y="155" width="55" height="20" rx="10" fill="#F46800" opacity="0.4"/>
  <text x="142" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Grafana</text>
  <rect x="180" y="155" width="45" height="20" rx="10" fill="#3776AB" opacity="0.4"/>
  <text x="202" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Python</text>
  <rect x="235" y="155" width="40" height="20" rx="10" fill="#f74c00" opacity="0.4"/>
  <text x="255" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Rust</text>
  <rect x="285" y="155" width="55" height="20" rx="10" fill="#FFB800" opacity="0.4"/>
  <text x="312" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Private</text>
</svg>
