<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="teamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="180" fill="url(#teamBg)" rx="16"/>
  
  <!-- Member 1 - Rangga -->
  <g transform="translate(150, 90)">
    <circle cx="0" cy="-15" r="45" fill="url(#purple)" opacity="0.2"/>
    <circle cx="0" cy="-15" r="40" fill="#1e1e2e" stroke="#7c3aed" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#fff">RP</text>
    <text x="0" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">Rangga Putra</text>
    <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7c3aed">@dansiapa</text>
    <rect x="-40" y="82" width="80" height="22" rx="11" fill="#7c3aed" opacity="0.2"/>
    <text x="0" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a855f7">FOUNDER</text>
  </g>
  
  <!-- Divider -->
  <line x1="450" y1="30" x2="450" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Member 2 - Leo -->
  <g transform="translate(750, 90)">
    <circle cx="0" cy="-15" r="45" fill="url(#cyan)" opacity="0.2"/>
    <circle cx="0" cy="-15" r="40" fill="#1e1e2e" stroke="#00d4ff" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#fff">LT</text>
    <text x="0" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">Leo Tarung</text>
    <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#00d4ff">@LeoTarung</text>
    <rect x="-50" y="82" width="100" height="22" rx="11" fill="#00d4ff" opacity="0.2"/>
    <text x="0" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#22d3ee">CORE MEMBER</text>
  </g>
  
  <!-- Center text -->
  <text x="450" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Building</text>
  <text x="450" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Together</text>
</svg>
