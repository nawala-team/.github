<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="teamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="220" fill="url(#teamBg)" rx="12"/>
  <rect width="798" height="218" x="1" y="1" fill="none" stroke="#334155" stroke-width="1" rx="11" opacity="0.5"/>
  
  <!-- Member 1 - Rangga -->
  <g transform="translate(200, 110)">
    <circle cx="0" cy="-20" r="40" fill="#1e1e2e" stroke="#7c3aed" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">RP</text>
    <text x="0" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">Rangga Putra</text>
    <text x="0" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">@dansiapa</text>
    <rect x="-35" y="82" width="70" height="24" rx="12" fill="#7c3aed" opacity="0.2"/>
    <text x="0" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a855f7">Founder</text>
  </g>
  
  <!-- Member 2 - Leo -->
  <g transform="translate(600, 110)">
    <circle cx="0" cy="-20" r="40" fill="#1e1e2e" stroke="#00d4ff" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#fff">LT</text>
    <text x="0" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">Leo Tarung</text>
    <text x="0" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">@LeoTarung</text>
    <rect x="-50" y="82" width="100" height="24" rx="12" fill="#00d4ff" opacity="0.2"/>
    <text x="0" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22d3ee">Core Member</text>
  </g>
  
  <!-- Center divider -->
  <line x1="400" y1="40" x2="400" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Building</text>
  <text x="400" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Together</text>
</svg>
