<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#1a2d3e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#0088cc"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow5">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="400" height="200" fill="url(#bg5)" rx="16" filter="url(#shadow5)"/>
  <rect width="398" height="198" x="1" y="1" fill="none" stroke="url(#purple)" stroke-width="2" rx="15">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <circle cx="55" cy="50" r="2" fill="#7C3AED" opacity="0.6">
    <animate attributeName="cy" values="50;150;50" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="150" r="1.5" fill="#0088cc" opacity="0.4">
    <animate attributeName="cy" values="150;50;150" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="100" r="40" fill="url(#purple)" opacity="0.2"/>
  <text x="70" y="115" text-anchor="middle" font-size="45" filter="url(#glow5)">🤖</text>
  
  <text x="230" y="60" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="bold" filter="url(#glow5)">VidyaBot</text>
  
  <rect x="165" y="72" width="130" height="24" rx="12" fill="#0088cc" opacity="0.3"/>
  <text x="230" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">@VidyaNawalaBot</text>
  
  <text x="230" y="120" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">AI-Powered Assistant Bot</text>
  <text x="230" y="140" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="11">Automation • Smart Replies • Task Manager</text>
  
  <rect x="115" y="155" width="60" height="20" rx="10" fill="#0088cc" opacity="0.4"/>
  <text x="145" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Telegram</text>
  <rect x="185" y="155" width="50" height="20" rx="10" fill="#3776AB" opacity="0.4"/>
  <text x="210" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Python</text>
  <rect x="245" y="155" width="40" height="20" rx="10" fill="#f74c00" opacity="0.4"/>
  <text x="265" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Rust</text>
  <rect x="295" y="155" width="50" height="20" rx="10" fill="#7C3AED" opacity="0.4"/>
  <text x="320" y="169" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Private</text>
</svg>
