<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg1)" rx="16"/>
  <rect width="400" height="200" fill="none" stroke="url(#gold)" stroke-width="2" rx="16">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating particles -->
  <circle cx="50" cy="30" r="2" fill="#FFB300" opacity="0.6">
    <animate attributeName="cy" values="30;170;30" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="170" r="1.5" fill="#FFB300" opacity="0.4">
    <animate attributeName="cy" values="170;30;170" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="50" r="1" fill="#fff" opacity="0.3">
    <animate attributeName="cy" values="50;150;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Icon -->
  <circle cx="70" cy="100" r="40" fill="url(#gold)" opacity="0.15"/>
  <text x="70" y="115" text-anchor="middle" font-size="45" filter="url(#glow1)">💻</text>
  
  <!-- Title -->
  <text x="230" y="60" text-anchor="middle" fill="url(#gold)" font-family="Arial, sans-serif" font-size="28" font-weight="bold" filter="url(#glow1)">Sanchala OS</text>
  
  <!-- Version badge -->
  <rect x="165" y="72" width="130" height="24" rx="12" fill="#FFB300" opacity="0.2"/>
  <text x="230" y="89" text-anchor="middle" fill="#FFB300" font-family="Arial, sans-serif" font-size="12" font-weight="bold">v1.0 "Astra" ⚡</text>
  
  <!-- Description -->
  <text x="230" y="120" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">Beautiful &amp; Secure Linux Distribution</text>
  <text x="230" y="140" text-anchor="middle" fill="#8b8ba7" font-family="Arial, sans-serif" font-size="11">macOS UI • 8-Layer Security • KDE Plasma 6</text>
  
  <!-- Tech badges -->
  <rect x="130" y="155" width="45" height="20" rx="10" fill="#1793D1" opacity="0.3"/>
  <text x="152" y="169" text-anchor="middle" fill="#1793D1" font-family="Arial, sans-serif" font-size="10">Arch</text>
  <rect x="185" y="155" width="45" height="20" rx="10" fill="#1D99F3" opacity="0.3"/>
  <text x="207" y="169" text-anchor="middle" fill="#1D99F3" font-family="Arial, sans-serif" font-size="10">KDE</text>
  <rect x="240" y="155" width="55" height="20" rx="10" fill="#3776AB" opacity="0.3"/>
  <text x="267" y="169" text-anchor="middle" fill="#3776AB" font-family="Arial, sans-serif" font-size="10">Python</text>
  <rect x="305" y="155" width="55" height="20" rx="10" fill="#FFB300" opacity="0.3"/>
  <text x="332" y="169" text-anchor="middle" fill="#FFB300" font-family="Arial, sans-serif" font-size="10">GPL-3.0</text>
</svg>
