<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300"/>
      <stop offset="100%" style="stop-color:#FF6F00"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Glowing orbs -->
  <ellipse cx="200" cy="100" rx="200" ry="150" fill="#7c3aed" filter="url(#blur2)" opacity="0.3"/>
  <ellipse cx="1000" cy="350" rx="250" ry="180" fill="#00d4ff" filter="url(#blur2)" opacity="0.2"/>
  <ellipse cx="600" cy="400" rx="300" ry="150" fill="#FFB300" filter="url(#blur2)" opacity="0.15"/>
  
  <!-- Floating particles -->
  <circle cx="150" cy="80" r="3" fill="#7c3aed" opacity="0.8"/>
  <circle cx="300" cy="150" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="450" cy="50" r="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="700" cy="100" r="3" fill="#FFB300" opacity="0.7"/>
  <circle cx="900" cy="60" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="1050" cy="120" r="2" fill="#7c3aed" opacity="0.6"/>
  <circle cx="100" cy="300" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="1100" cy="280" r="3" fill="#FFB300" opacity="0.6"/>
  
  <!-- Main content -->
  <g transform="translate(600, 160)">
    <!-- Logo mark -->
    <g transform="translate(0, -20)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#glow1)" stroke-width="2" opacity="0.5"/>
      <circle cx="0" cy="0" r="35" fill="#1a1a3e"/>
      <text x="0" y="12" text-anchor="middle" font-size="36" fill="#fff" font-weight="bold">न</text>
    </g>
    
    <!-- Title -->
    <text x="0" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#fff" letter-spacing="-2">NAWALA</text>
    <text x="0" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#a0a0c0" letter-spacing="12">TEAM</text>
    
    <!-- Tagline -->
    <text x="0" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#888">Building the future of security</text>
  </g>
  
  <!-- Project indicators at bottom -->
  <g transform="translate(600, 340)">
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="20" fill="url(#glow3)" opacity="0.3"/>
      <text x="0" y="6" text-anchor="middle" font-size="16">💻</text>
      <text x="0" y="35" text-anchor="middle" font-size="11" fill="#FFB300">Sanchala</text>
    </g>
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="20" fill="url(#glow1)" opacity="0.3"/>
      <text x="0" y="6" text-anchor="middle" font-size="16">🔐</text>
      <text x="0" y="35" text-anchor="middle" font-size="11" fill="#7c3aed">Nawala</text>
    </g>
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="20" fill="url(#glow2)" opacity="0.3"/>
      <text x="0" y="6" text-anchor="middle" font-size="16">🛡️</text>
      <text x="0" y="35" text-anchor="middle" font-size="11" fill="#00d4ff">Raksha</text>
    </g>
  </g>
</svg>
