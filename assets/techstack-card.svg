<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#techBg)" rx="12"/>
  <rect width="798" height="198" x="1" y="1" fill="none" stroke="#334155" stroke-width="1" rx="11" opacity="0.5"/>
  
  <!-- Row 1 -->
  <g transform="translate(30, 25)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7c3aed">LANGUAGES</text>
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#dea584" opacity="0.2"/><text x="25" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#dea584">Rust</text>
      <rect x="55" y="0" width="50" height="22" rx="4" fill="#ED8B00" opacity="0.2"/><text x="80" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ED8B00">Java</text>
      <rect x="110" y="0" width="55" height="22" rx="4" fill="#3776AB" opacity="0.2"/><text x="137" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3776AB">Python</text>
      <rect x="170" y="0" width="75" height="22" rx="4" fill="#3178C6" opacity="0.2"/><text x="207" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3178C6">TypeScript</text>
      <rect x="250" y="0" width="45" height="22" rx="4" fill="#4EAA25" opacity="0.2"/><text x="272" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#89e051">Bash</text>
    </g>
  </g>
  
  <g transform="translate(420, 25)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#00d4ff">FRAMEWORKS</text>
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#6DB33F" opacity="0.2"/><text x="25" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6DB33F">Spring</text>
      <rect x="55" y="0" width="55" height="22" rx="4" fill="#888" opacity="0.2"/><text x="82" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fff">Next.js</text>
      <rect x="115" y="0" width="50" height="22" rx="4" fill="#61DAFB" opacity="0.2"/><text x="140" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#61DAFB">React</text>
      <rect x="170" y="0" width="35" height="22" rx="4" fill="#41CD52" opacity="0.2"/><text x="187" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#41CD52">Qt</text>
      <rect x="210" y="0" width="60" height="22" rx="4" fill="#06B6D4" opacity="0.2"/><text x="240" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#06B6D4">Tailwind</text>
    </g>
  </g>
  
  <!-- Row 2 -->
  <g transform="translate(30, 100)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFB300">INFRASTRUCTURE</text>
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="45" height="22" rx="4" fill="#FCC624" opacity="0.2"/><text x="22" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#FCC624">Linux</text>
      <rect x="50" y="0" width="55" height="22" rx="4" fill="#2496ED" opacity="0.2"/><text x="77" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2496ED">Docker</text>
      <rect x="110" y="0" width="70" height="22" rx="4" fill="#326CE5" opacity="0.2"/><text x="145" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#326CE5">Kubernetes</text>
      <rect x="185" y="0" width="50" height="22" rx="4" fill="#009639" opacity="0.2"/><text x="210" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#009639">Nginx</text>
      <rect x="240" y="0" width="70" height="22" rx="4" fill="#F38020" opacity="0.2"/><text x="275" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#F38020">Cloudflare</text>
    </g>
  </g>
  
  <g transform="translate(420, 100)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981">DATABASE</text>
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#4169E1" opacity="0.2"/><text x="35" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4169E1">PostgreSQL</text>
      <rect x="75" y="0" width="45" height="22" rx="4" fill="#DC382D" opacity="0.2"/><text x="97" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#DC382D">Redis</text>
      <rect x="125" y="0" width="75" height="22" rx="4" fill="#005571" opacity="0.2"/><text x="162" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#00bfb3">Elasticsearch</text>
      <rect x="205" y="0" width="55" height="22" rx="4" fill="#F46800" opacity="0.2"/><text x="232" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#F46800">Grafana</text>
      <rect x="265" y="0" width="70" height="22" rx="4" fill="#E6522C" opacity="0.2"/><text x="300" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#E6522C">Prometheus</text>
    </g>
  </g>
  
  <!-- Bottom -->
  <text x="400" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Modern stack for modern solutions</text>
</svg>
