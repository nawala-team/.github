<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg2)" rx="16"/>
  <rect width="400" height="200" fill="none" stroke="url(#purple)" stroke-width="2" rx="16">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  
  <!-- Floating particles -->
  <circle cx="60" cy="40" r="2" fill="#7c3aed" opacity="0.6">
    <animate attributeName="cy" values="40;160;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="160" r="1.5" fill="#7c3aed" opacity="0.4">
    <animate attributeName="cy" values="160;40;160" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="180" r="1" fill="#fff" opacity="0.3">
    <animate attributeName="cy" values="180;20;180" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Icon -->
  <circle cx="70" cy="100" r="40" fill="url(#purple)" opacity="0.15"/>
  <text x="70" y="115" text-anchor="middle" font-size="45" filter="url(#glow2)">🔐</text>
  
  <!-- Title -->
  <text x="230" y="60" text-anchor="middle" fill="url(#purple)" font-family="Arial, sans-serif" font-size="26" font-weight="bold" filter="url(#glow2)">Nawala Gateway</text>
  
  <!-- Version badge -->
  <rect x="155" y="72" width="150" height="24" rx="12" fill="#7c3aed" opacity="0.2"/>
  <text x="230" y="89" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Enterprise API Gateway</text>
  
  <!-- Description -->
  <text x="230" y="120" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13">Secure API Gateway Platform</text>
  <text x="230" y="140" text-anchor="middle" fill="#8b8ba7" font-family="Arial, sans-serif" font-size="11">WAF • OAuth2 • Rate Limiting • AI Detection</text>
  
  <!-- Tech badges -->
  <rect x="120" y="155" width="45" height="20" rx="10" fill="#ED8B00" opacity="0.3"/>
  <text x="142" y="169" text-anchor="middle" fill="#ED8B00" font-family="Arial, sans-serif" font-size="10">Java</text>
  <rect x="175" y="155" width="50" height="20" rx="10" fill="#6DB33F" opacity="0.3"/>
  <text x="200" y="169" text-anchor="middle" fill="#6DB33F" font-family="Arial, sans-serif" font-size="10">Spring</text>
  <rect x="235" y="155" width="45" height="20" rx="10" fill="#DC382D" opacity="0.3"/>
  <text x="257" y="169" text-anchor="middle" fill="#DC382D" font-family="Arial, sans-serif" font-size="10">Redis</text>
  <rect x="290" y="155" width="45" height="20" rx="10" fill="#7c3aed" opacity="0.3"/>
  <text x="312" y="169" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="10">MIT</text>
</svg>
