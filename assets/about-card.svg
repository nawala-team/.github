<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#FFB300"/>
    </linearGradient>
  </defs>
  
  <!-- Card background -->
  <rect width="900" height="200" fill="url(#cardBg)" rx="16"/>
  <rect width="898" height="198" x="1" y="1" fill="none" stroke="url(#accent)" stroke-width="2" rx="15" opacity="0.5"/>
  
  <!-- Left side - Title -->
  <text x="50" y="60" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#fff">NAWALA</text>
  <text x="50" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#7c3aed" letter-spacing="2">(नवल) SANSKRIT FOR "NEW"</text>
  <text x="50" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">We build modern, secure, and elegant</text>
  <text x="50" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">infrastructure solutions.</text>
  
  <!-- Divider -->
  <line x1="350" y1="30" x2="350" y2="170" stroke="#334155" stroke-width="1"/>
  
  <!-- Right side - Features -->
  <g transform="translate(400, 45)">
    <rect x="0" y="0" width="110" height="55" rx="8" fill="#7c3aed" opacity="0.15"/>
    <text x="55" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7">SECURITY</text>
    <text x="55" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Military-grade</text>
  </g>
  
  <g transform="translate(525, 45)">
    <rect x="0" y="0" width="110" height="55" rx="8" fill="#00d4ff" opacity="0.15"/>
    <text x="55" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">PERFORMANCE</text>
    <text x="55" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Blazing fast</text>
  </g>
  
  <g transform="translate(650, 45)">
    <rect x="0" y="0" width="110" height="55" rx="8" fill="#FFB300" opacity="0.15"/>
    <text x="55" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">BEAUTIFUL</text>
    <text x="55" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Modern UI/UX</text>
  </g>
  
  <g transform="translate(775, 45)">
    <rect x="0" y="0" width="110" height="55" rx="8" fill="#10b981" opacity="0.15"/>
    <text x="55" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">OPEN SOURCE</text>
    <text x="55" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Community</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="640" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Inspired by ancient wisdom, built for the future</text>
  <text x="640" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7c3aed">नवल • संचल • रक्षा</text>
</svg>
