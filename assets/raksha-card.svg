<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow2"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg2)" rx="16" filter="url(#shadow2)"/>
  <rect width="398" height="198" x="1" y="1" fill="none" stroke="url(#cyan)" stroke-width="1.5" rx="15" opacity="0.8"/>
  <circle cx="50" cy="40" r="80" fill="#00d4ff" opacity="0.03"/>
  <circle cx="380" cy="180" r="60" fill="#0891b2" opacity="0.05"/>
  <g transform="translate(55,75)">
