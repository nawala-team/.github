    <polygon points="25,10 40,20 40,35 25,42 10,35 10,20" fill="#00d4ff" opacity="0.3"/>
    <circle cx="25" cy="25" r="8" fill="#00d4ff" opacity="0.8"/>
  </g>
  <text x="140" y="75" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="bold">Raksha</text>
